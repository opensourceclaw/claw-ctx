name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node-version }}' }
      - name: Checkout claw-mem
        uses: actions/checkout@v4
        with:
          repository: petercheng/claw-mem
          path: claw-mem-temp
          sparse-checkout: |
            src
            package.json
            tsconfig.json
          sparse-checkout-cone-mode: false
      - name: Build claw-mem
        run: |
          cd claw-mem-temp
          npm install --ignore-scripts
          npm run build
          cd dist
          mkdir -p ../.libs && cp -r * ../.libs/ || true
      - name: Prepare claw-mem
        run: |
          mkdir -p ../claw-mem
          cp -r claw-mem-temp/dist/* ../claw-mem/ 2>/dev/null || true
          cp claw-mem-temp/package.json ../claw-mem/ 2>/dev/null || true
      - run: npm ci
      - run: npx vitest run --exclude="**/performance/**"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build