name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # CX-16: manual dry-run of the CI audit path

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --exclude="**/performance**"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  # CX-16: required check named `release` on main push — ruleset's
  # required_status_checks.context = "release" finally has a real source
  # (was "expected but absent" on main → perpetual admin bypass, OBS-A).
  # Runs build + test + the versioned-surface stage-gate audit (the receipt
  # audit stays client-side: inbox/ is not versioned — see
  # docs/audits/stage-gate-defense-in-depth.md).
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --exclude="**/performance**"
      - name: stage-gate repo audit
        run: sh tools/audit-stage-gate.sh --mode=repo --local="$GITHUB_SHA"
