name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # CX-16: renamed so the required context `release` maps to ci.yml's
  # main-push job (see docs/audits/stage-gate-defense-in-depth.md)
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - run: npm test -- --no-coverage
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CX-15 + family rule (devclaw/docs/protocol/UNIFIED-RELEASE-PROCESS.md):
      # idempotent create-if-absent by full list lookup + post-verify.
      # Release notes are hand-written English via --notes-file; a missing
      # release-notes/<tag>.md is FATAL (no --generate-notes fallback), and the
      # script CJK-gates the landed title+body before reporting success.
      - run: sh scripts/release-idempotency.sh "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
