name: TokenProbe
on: push
permissions:
  contents: read
  packages: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== packages read probe =="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/opensourceclaw/claw-ctx/packages?package_type=npm" | head -c 300
          echo
          echo "== npm registry write probe (dry check via publish to scratch) =="
          echo "token-first-8: ${GITHUB_TOKEN:0:8}"
      - run: |
          echo "== scopes via /user =="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user | head -c 200
